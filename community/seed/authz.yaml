# Default grants: role key -> permission codes (roadmap §6.5).
#
# Applied only by `flask authz seed`, which adds missing grants and never removes any.
# Office roles list only the grants they add on top of the Bursch rank.
# Codes of modules that do not exist yet are skipped until the module declares them.
# Points the club has not decided yet (marked "?" in the roadmap) are left out = not granted.

