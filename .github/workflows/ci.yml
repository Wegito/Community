name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The server's Python version is not confirmed yet (roadmap question 2).
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov --cov-report=term-missing

  migrations:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      SQLALCHEMY_DATABASE_URI: sqlite:////tmp/ci-migrations.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Exactly one migration head
        run: |
          heads=$(flask db heads | grep -c '(head)')
          echo "heads: $heads"
          test "$heads" -eq 1
      - name: Upgrade an empty database
        run: flask db upgrade
      - name: Models and migrations agree
        run: flask db check
      - name: Downgrade to empty and upgrade again
        run: flask db downgrade base && flask db upgrade

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendored files match their checksums
        working-directory: community/static/vendor
        run: sha256sum -c SHA256SUMS
      - uses: actions/cache@v4
        with:
          path: tools/bin
          key: tailwind-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-css.sh') }}
      - name: Build the CSS with the pinned Tailwind CLI
        run: tools/build-css.sh
      - name: Committed app.css is up to date
        run: |
          if ! git diff --exit-code -- community/static/app.css; then
            echo "::error::community/static/app.css is out of date. Run tools/build-css.sh and commit the result."
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
